<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CardFlow | Binders</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <div class="brand-block">
          <h1 class="brand">CardFlow</h1>
          <p class="subtitle">Your digital trading card binder</p>
        </div>
        <div class="header-actions">
          <button class="nav-toggle" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">☰</button>
          <nav id="main-nav" aria-label="Main navigation">
            <ul class="nav-links" role="list">
              <li><a href="index.html">Home</a></li>
              <li><a href="add-card.html">Add Cards</a></li>
              <li><a href="binders.html" aria-current="page">Binders</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

<main class="page glass-panel">

  <h1 class="page-title">Binders</h1>

  <section class="panel">

    <div class="panel-head">
      <h2>Your Binders</h2>
      <button class="btn danger" id="clearAll">Clear All Binders</button>
    </div>

    <!-- FORM -->
    <div id="binderForm" class="binder-form">

      <label>
        Binder Name:
        <input type="text" id="binderName" placeholder="Enter binder name">
      </label>

      <label>
        Description:
        <input type="text" id="binderDesc" placeholder="Enter description">
      </label>

      <label>
        Cover Image:
        <input type="file" id="binderImage" accept="image/*">
      </label>

      <div class="form-actions">
        <button class="btn primary" id="saveBinder">Save</button>
      </div>
    </div>

    <!-- RENDER AREA (IMPORTANT) -->
    <div id="binderList" class="binder-list"></div>

  </section>

</main>

<footer class="footer">
  <p>&copy; 2026 CardFlow. All rights reserved.</p>
</footer>

    <script type="module" src="js/binders.js"></script>
  </body>
</html>
