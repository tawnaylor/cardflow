<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CardFlow | Card Detail</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <div class="brand-block">
          <h1 class="brand">CardFlow</h1>
          <p class="subtitle">Your digital trading card binder</p>
        </div>
        <div class="header-actions">
          <button class="nav-toggle" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">☰</button>
          <nav id="main-nav" aria-label="Main navigation">
            <ul class="nav-links" role="list">
              <li><a href="index.html">Home</a></li>
              <li><a href="add-card.html">Add Cards</a></li>
              <li><a href="binders.html">Binders</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
    <main class="container" style="padding-top:32px;padding-bottom:60px;">
      <a href="index.html" class="btn" style="display:inline-block;margin-bottom:20px;">← Back to Collection</a>
      <div id="cardDetailContainer" aria-live="polite"><p>Loading card…</p></div>
      <form id="cardEditForm" class="form" style="display:none; max-width:960px; margin-top:20px;" novalidate>
        <div class="form-grid">
          <label class="field">
            <span>Game</span>
            <select id="editGame" name="game">
              <option value="pokemon">Pokémon</option>
              <option value="mtg">Magic: The Gathering</option>
              <option value="onepiece">One Piece</option>
            </select>
          </label>
          <label class="field">
            <span>Name</span>
            <input id="editName" name="name" type="text" minlength="2" />
          </label>
          <label class="field">
            <span>Set</span>
            <input id="editSetId" name="setId" type="text" />
          </label>
          <label class="field">
            <span>Card Number</span>
            <input id="editCardNumber" name="cardNumber" type="text" />
          </label>
          <label class="field">
            <span>Condition</span>
            <select id="editCondition" name="condition">
              <option value="NM">Near Mint (NM)</option>
              <option value="LP">Lightly Played (LP)</option>
              <option value="MP">Moderately Played (MP)</option>
              <option value="HP">Heavily Played (HP)</option>
              <option value="DMG">Damaged (DMG)</option>
            </select>
          </label>
          <label class="field">
            <span>Quantity</span>
            <input id="editQuantity" name="quantity" type="number" min="1" value="1" />
          </label>
          <label class="field checkbox">
            <input id="editFoil" name="foil" type="checkbox" />
            <span>Foil</span>
          </label>
          <label class="field">
            <span>Purchase Price</span>
            <input id="editPurchasePrice" name="purchasePrice" type="number" min="0" step="0.01" />
          </label>
          <label class="field">
            <span>Current Value</span>
            <input id="editCurrentValue" name="currentValue" type="number" min="0" step="0.01" />
          </label>
          <label class="field field-wide">
            <span>Image URL</span>
            <input id="editImageUrl" name="imageUrl" type="url" />
          </label>
          <label class="field field-wide">
            <span>Upload Image</span>
            <input id="editImageFile" name="imageFile" type="file" accept="image/*" />
          </label>
          <label class="field full">
            <span>Notes</span>
            <textarea id="editNotes" name="notes" class="textarea" rows="4" maxlength="500"></textarea>
          </label>
        </div>
        <div class="details-actions" style="margin-top:18px;">
          <button id="saveEditBtn" class="btn primary" type="submit">Save Changes</button>
          <button id="cancelEditBtn" class="btn" type="button">Cancel</button>
        </div>
      </form>
      <p id="cardEditStatus" class="form-status" role="status" aria-live="polite"></p>
    </main>
    <div id="toast" class="toast" hidden aria-live="polite" aria-atomic="true"></div>
    <footer class="site-footer" role="contentinfo">
      <div class="footer-inner">
        <div class="footer-brand">CardFlow</div>
        <nav class="footer-center" aria-label="Footer navigation">
          <a href="index.html">Home</a>
          <a href="add-card.html">Add Cards</a>
          <a href="binders.html">Binders</a>
        </nav>
      </div>
    </footer>
    <script type="module" src="js/card-detail.js"></script>
  </body>
</html>
