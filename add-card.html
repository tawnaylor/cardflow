<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CardFlow | Add Cards</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <div class="brand-block">
          <h1 class="brand">CardFlow</h1>
          <p class="subtitle">Your digital trading card binder</p>
        </div>
        <div class="header-actions">
          <button class="nav-toggle" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">☰</button>
          <nav id="main-nav" aria-label="Main navigation">
            <ul class="nav-links" role="list">
              <li><a href="index.html">Home</a></li>
              <li><a href="add-card.html" aria-current="page">Add Cards</a></li>
              <li><a href="binders.html">Binders</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main class="container" style="padding-top:32px; padding-bottom:60px;">
      <h2 style="margin-bottom:8px;">Add a Card</h2>

      <section class="panel" style="margin-bottom:20px;" aria-label="TCGdex autofill">
        <h3 style="margin-top:0;">TCGdex Autofill</h3>
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
          <label class="field" style="flex:1;min-width:200px;">
            <span class="field-label">TCGdex Card ID</span>
            <input id="tcgdexCardId" class="input" type="text" placeholder="e.g. swsh3-136" aria-describedby="autofill-hint" />
          </label>
          <button type="button" id="lookupTcgdexBtn" class="btn primary">Autofill</button>
        </div>
        <small class="hint" id="autofill-hint">Fetch card details from TCGdex and prefill the form.</small>
        <p id="autofillStatus" role="status" aria-live="polite" style="margin-top:8px;font-size:14px;min-height:20px;"></p>
      </section>

      <section class="panel" aria-label="Add card form">
        <form id="cardForm" novalidate>
          <div class="form-grid">

            <label class="field">
              <span class="field-label">Card Name <span class="req" aria-hidden="true">*</span></span>
              <input id="cardName" name="name" class="input" type="text" required minlength="2"
                     aria-required="true" aria-describedby="err-name" />
              <small class="error" id="err-name" role="alert"></small>
            </label>

            <label class="field">
              <span class="field-label">Series <span class="req" aria-hidden="true">*</span></span>
              <select id="seriesSelect" name="series" class="select" required
                      aria-required="true" aria-describedby="err-series">
                <option value="">Select a series…</option>
              </select>
              <small class="error" id="err-series" role="alert"></small>
            </label>

            <label class="field">
              <span class="field-label">Expansion <span class="req" aria-hidden="true">*</span></span>
              <select id="expansionSelect" name="expansion" class="select" required
                      aria-required="true" aria-describedby="err-expansion">
                <option value="">Select an expansion…</option>
              </select>
              <small class="error" id="err-expansion" role="alert"></small>
            </label>

            <label class="field">
              <span class="field-label">Rarity <span class="req" aria-hidden="true">*</span></span>
              <select id="raritySelect" name="rarity" class="select" required
                      aria-required="true" aria-describedby="err-rarity">
                <option value="">Select…</option>
                <option>Common</option>
                <option>Uncommon</option>
                <option>Rare</option>
                <option>Holo Rare</option>
                <option>Illustration Rare</option>
                <option>Ultra Rare</option>
                <option>Secret Rare</option>
              </select>
              <small class="error" id="err-rarity" role="alert"></small>
            </label>

            <label class="field">
              <span class="field-label">Card Number <span class="req" aria-hidden="true">*</span></span>
              <input id="cardNumber" name="number" class="input" type="text" required
                     pattern="[A-Za-z0-9/\-]{1,20}" aria-required="true"
                     aria-describedby="err-number hint-number" />
              <small class="hint" id="hint-number">1–20 chars: letters, numbers, / or -</small>
              <small class="error" id="err-number" role="alert"></small>
            </label>

            <label class="field">
              <span class="field-label">Quantity</span>
              <input id="qtyInput" name="qty" class="input" type="number" min="1" value="1" />
            </label>

            <label class="field full">
              <span class="field-label">Image URL (optional)</span>
              <input id="imageUrl" name="imageUrl" class="input" type="url" placeholder="https://…" />
              <small class="hint">CORS may block some remote images.</small>
            </label>

            <label class="field full">
              <span class="field-label">Upload Image (optional)</span>
              <input id="imageInput" class="input" type="file" accept="image/*" />
              <small class="hint">Stored locally in your browser as base64.</small>
            </label>

          </div>

          <div class="modal-footer" style="padding:20px 0 0;border-top:1px solid rgba(255,255,255,0.08);margin-top:20px;">
            <button class="btn primary" type="submit">Add to Collection</button>
            <button class="btn" type="button" id="seedDemo">Add Demo Cards</button>
          </div>

          <p id="status" role="status" aria-live="polite" style="margin-top:14px;min-height:20px;color:var(--muted);"></p>
        </form>
      </section>
    </main>

    <div id="toast" class="toast" hidden aria-live="polite" aria-atomic="true"></div>

    <footer class="site-footer" role="contentinfo">
      <div class="footer-inner">
        <div class="footer-brand">CardFlow</div>
        <nav class="footer-center" aria-label="Footer navigation">
          <a href="index.html">Home</a>
          <a href="add-card.html" aria-current="page">Add Cards</a>
          <a href="binders.html">Binders</a>
        </nav>
      </div>
    </footer>

    <script type="module" src="js/add.js"></script>
  </body>
</html>
