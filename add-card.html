<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CardFlow | Add Card</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <div>
          <h1 class="brand">CardFlow</h1>
          <p class="subtitle">Your digital trading card binder</p>
        </div>
        <div class="header-actions">
          <button class="nav-toggle" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">☰</button>
          <nav id="main-nav">
            <ul class="nav-links" role="list">
              <li><a href="index.html">Home</a></li>
              <li><a href="add-card.html" aria-current="page">Add Cards</a></li>
              <li><a href="binders.html">Binders</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main class="container" style="padding-top: 32px;">
      <h2 style="margin-bottom: 24px;">Add a Card</h2>

      <section class="panel" style="margin-bottom: 24px;">
        <h3 style="margin-top:0;">TCGdex Autofill</h3>
        <div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;">
          <label class="field" style="flex:1; min-width:200px;">
            <span class="field-label">TCGdex Card ID</span>
            <input id="tcgdex-id" class="input" type="text" placeholder="e.g. swsh1-1" aria-describedby="autofill-help" />
          </label>
          <button type="button" id="autofill-btn" class="btn primary">Autofill</button>
        </div>
        <small class="hint" id="autofill-help">Fetch card details from TCGdex and prefill the form below.</small>
        <p id="autofill-status" role="status" aria-live="polite" style="margin-top:8px; font-size:14px;"></p>
      </section>

      <section class="panel">
        <form id="add-card-form" novalidate aria-label="Add a new card">
          <div class="form-grid">

            <label class="field">
              <span class="field-label">Card Name <span class="req" aria-hidden="true">*</span></span>
              <input id="card-name" class="input" type="text" required minlength="2"
                     aria-required="true" aria-describedby="err-card-name" />
              <small class="error" id="err-card-name" role="alert"></small>
              <small class="hint">At least 2 characters.</small>
            </label>

            <label class="field">
              <span class="field-label">Series <span class="req" aria-hidden="true">*</span></span>
              <select id="series" class="select" required aria-required="true" aria-describedby="err-series">
                <option value="">Select a series…</option>
              </select>
              <small class="error" id="err-series" role="alert"></small>
            </label>

            <label class="field">
              <span class="field-label">Series Expansion <span class="req" aria-hidden="true">*</span></span>
              <select id="expansion" class="select" required aria-required="true" aria-describedby="err-expansion">
                <option value="">Select an expansion…</option>
              </select>
              <small class="error" id="err-expansion" role="alert"></small>
            </label>

            <label class="field">
              <span class="field-label">Rarity <span class="req" aria-hidden="true">*</span></span>
              <select id="rarity" class="select" required aria-required="true" aria-describedby="err-rarity">
                <option value="">Select…</option>
                <option>Common</option>
                <option>Uncommon</option>
