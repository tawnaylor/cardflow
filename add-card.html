<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CardFlow | Add Cards</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body class="neon-street">

  <div class="bg-effects" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <img src="./images/cardflow%20logo.jpeg" alt="CardFlow logo">
      </div>
      <span class="brand-name">CardFlow</span>
    </div>

    <button class="nav-toggle" aria-label="Toggle navigation">☰</button>

    <nav class="nav">
      <a class="nav-link" href="./index.html">Home</a>
      <a class="nav-link" href="./add-card.html">Add Cards</a>
      <a class="nav-link" href="./binders.html">Binders</a>
    </nav>
  </header>

  <main class="page glass-panel">
    <h1 class="page-title">Add Cards</h1>

    <form id="cardForm" class="form" novalidate>
      <div class="form-grid">

        <label class="field field-wide">
          <span>TCGdex Card ID</span>
          <div class="field-inline">
            <input id="tcgdexCardId" type="text" placeholder="e.g., swsh3-136" />
            <button class="btn" type="button" id="lookupTcgdexBtn">Autofill</button>
          </div>
        </label>

        <label class="field">
          <span>Card Name *</span>
          <input name="name" type="text" required minlength="2" />
        </label>

        <label class="field">
          <span>Series *</span>
          <select id="seriesSelect" name="series" required>
            <option value="" disabled selected>Select a series…</option>
          </select>
        </label>

        <label class="field">
          <span>Series Expansion *</span>
          <select id="expansionSelect" name="expansion" required>
            <option value="" disabled selected>Select an expansion…</option>
          </select>
        </label>

        <label class="field">
          <span>Rarity *</span>
          <select name="rarity" required>
            <option value="" disabled selected>Select…</option>
            <option>Common</option>
            <option>Uncommon</option>
            <option>Rare</option>
            <option>Holo Rare</option>
            <option>Ultra Rare</option>
          </select>
        </label>

        <label class="field">
          <span>Card Number *</span>
          <input name="number" type="text" required />
        </label>

        <label class="field">
          <span>Quantity</span>
          <input name="qty" type="number" min="1" value="1" />
        </label>

        <label class="field">
          <span>Image URL</span>
          <input id="imageUrl" name="imageUrl" type="url" />
        </label>

        <label class="field field-wide">
          <span>Upload Image</span>
          <input id="imageInput" type="file" accept="image/*" />
        </label>

      </div>

      <div class="form-actions">
        <button class="btn primary" type="submit">Add To Binder</button>
        <button class="btn" type="button" id="seedDemo">Add Demo Cards</button>
      </div>

      <p id="status" class="form-status"></p>
    </form>
  </main>

  <footer class="footer">
    <p>&copy; 2026 CardFlow. All rights reserved.</p>
  </footer>

  <script type="module" src="./js/add.js"></script>
  <script src="./js/navbar.js"></script>
  <script src="./js/binders.js"></script>

</body>
</html>
