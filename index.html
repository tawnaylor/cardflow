<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CardFlow</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/animations.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-row">
        <div>
          <h1 class="brand">CardFlow</h1>
          <p class="subtitle">Your digital trading card binder</p>
        </div>

        <div class="header-actions">
          <!-- Hamburger for mobile -->
          <button class="nav-toggle" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">☰</button>
          <nav id="main-nav">
            <ul class="nav-links" role="list">
              <li><a href="index.html" aria-current="page">Home</a></li>
              <li><a href="add-card.html">Add Cards</a></li>
              <li><a href="binders.html">Binders</a></li>
            </ul>
          </nav>
          <button id="addCardBtn" class="btn primary" type="button">+ Add Card</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <div class="panel-row">
          <div class="summary">
            <div class="summary-item">
              <div class="summary-label">Total cards</div>
              <div id="totalCards" class="summary-value">0</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">Estimated value</div>
              <div id="totalValue" class="summary-value">$0.00</div>
            </div>
          </div>

          <div class="filters-toggle-wrap">
            <button id="toggleFiltersBtn" class="btn ghost" type="button"
                    aria-expanded="true" aria-controls="filters">
              Filters
            </button>
          </div>
        </div>

        <div id="filters" class="filters">
          <label class="field">
            <span class="field-label">Search</span>
            <input id="searchInput" class="input" type="search"
                   placeholder="Search by card name…"
                   aria-label="Search cards by name" />
          </label>

          <label class="field">
            <span class="field-label">Game</span>
            <select id="gameFilter" class="select" aria-label="Filter by game">
              <option value="">All games</option>
              <option value="pokemon">Pokémon</option>
              <option value="mtg">Magic: The Gathering</option>
              <option value="onepiece">One Piece</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">Set</span>
            <select id="setFilter" class="select" aria-label="Filter by set">
              <option value="">All sets</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">Condition</span>
            <select id="conditionFilter" class="select" aria-label="Filter by condition">
              <option value="">All conditions</option>
              <option value="NM">Near Mint (NM)</option>
              <option value="LP">Lightly Played (LP)</option>
              <option value="MP">Moderately Played (MP)</option>
              <option value="HP">Heavily Played (HP)</option>
              <option value="DMG">Damaged (DMG)</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">Sort</span>
            <select id="sortSelect" class="select" aria-label="Sort cards">
              <option value="recent">Recently added</option>
              <option value="name">Name (A→Z)</option>
              <option value="valueDesc">Value (high→low)</option>
              <option value="qtyDesc">Quantity (high→low)</option>
            </select>
          </label>

          <div class="filters-actions">
            <button id="clearFiltersBtn" class="btn" type="button">Clear</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div id="emptyState" class="empty-state" hidden>
          <h2>No cards yet in here</h2>
          <p>Add your first card to start building your binder.</p>
          <button id="emptyAddBtn" class="btn primary" type="button">+ Add Card</button>
        </div>

        <div id="binderGrid" class="binder-grid" aria-live="polite" aria-label="Your card collection"></div>
      </section>
    </main>

    <!-- Add / Edit Card Modal -->
    <div id="modalOverlay" class="modal-overlay" hidden
         role="presentation" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle">Add Card</h2>
          <button id="closeModalBtn" class="icon-btn" type="button" aria-label="Close dialog">✕</button>
        </div>

        <form id="cardForm" class="modal-body" novalidate>
          <input type="hidden" id="cardId" />

          <div class="form-grid">
            <label class="field">
              <span class="field-label">Game <span class="req" aria-hidden="true">*</span></span>
              <select id="game" class="select" required aria-required="true" aria-describedby="err-game">
                <option value="">Select…</option>
                <option value="pokemon">Pokémon</option>
                <option value="mtg">Magic: The Gathering</option>
                <option value="onepiece">One Piece</option>
              </select>
              <small class="error" id="err-game" data-for="game" role="alert"></small>
            </label>

            <label class="field">
              <span class="field-label">Name <span class="req" aria-hidden="true">*</span></span>
              <input id="name" class="input" type="text" required maxlength="120"
                     aria-required="true" aria-describedby="err-name" />
              <small class="error" id="err-name" data-for="name" role="alert"></small>
            </label>

            <label class="field">
              <span class="field-label">Set <span class="req" aria-hidden="true">*</span></span>
              <select id="setId" class="select" required aria-required="true" aria-describedby="err-setId">
                <option value="">Select a game first…</option>
              </sel
