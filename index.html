<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="CardFlow helps you organize, browse, and manage your digital trading card collection with cards, binders, and quick search tools." />
  <title>CardFlow | Home</title>
  <link rel="preload" href="./css/styles.css" as="style">
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="neon-street">
  <div class="bg-effects" aria-hidden="true"></div>
<header class="topbar">
  <div class="brand">
      <div class="logo">
        <img
          src="./images/cardflow%20logo.jpeg"
          alt="CardFlow"
          width="320"
          height="320"
          fetchpriority="high"
          decoding="async"
          class="site-logo"
        >
      </div>
    <span class="brand-name">CardFlow</span>
  </div>

  <button class="nav-toggle" aria-label="Toggle navigation">☰</button>

  <nav class="nav">
    <a class="nav-link" href="./index.html">Home</a>
    <a class="nav-link" href="./add-card.html">Add Cards</a>
    <a class="nav-link" href="./binders.html">Binders</a>
  </nav>
</header>

  <main class="page glass-panel">
    <h1 class="hero">Your Digital Card Collection</h1>

    

    <section class="carousel" aria-label="Recent cards carousel">
      <button class="arrow" id="carouselPrev" aria-label="Previous cards">
        <span aria-hidden="true">‹</span>
      </button>

      <ul class="cards-row" id="cardsRow" aria-live="polite"></ul>

      <button class="arrow" id="carouselNext" aria-label="Next cards">
        <span aria-hidden="true">›</span>
      </button>
    </section>

    <nav class="carousel-nav" aria-label="Carousel pages">
      <div class="dots" id="dots"></div>
    </nav>

    <div class="pager" aria-label="Page controls">
      <button class="btn" id="pagePrev">‹ Prev</button>
      <div class="page-indicator" id="pageIndicator">Page 1 of 1</div>
      <button class="btn" id="pageNext">Next ›</button>
    </div>
  </main>
  
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <div class="footer-left">
        <div class="footer-logo">
          <img src="./images/cardflow%20logo.jpeg" alt="CardFlow" />
          <div>
            <div class="footer-brand">CardFlow</div>
          </div>
        </div>
      </div>

      <nav class="footer-center" aria-label="Footer navigation">
        <a href="./index.html">Home</a>
        <a href="./add-card.html">Add Cards</a>
        <a href="./binders.html">Binders</a>
      </nav>

      
    </div>
  </footer>

  <script type="module" src="./js/home.js"></script>
  <script src="./js/navbar.js" defer></script>
</body>
</html>
