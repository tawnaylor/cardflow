<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CardFlow | Home</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="neon-street">
  <div class="bg-effects" aria-hidden="true"></div>
<header class="topbar">
  <div class="brand">
    <div class="logo">
      <img src="./images/cardflow%20logo.jpeg" alt="CardFlow logo">
    </div>
    <span class="brand-name">CardFlow</span>
  </div>

  <button class="nav-toggle" aria-label="Toggle navigation">☰</button>

  <nav class="nav">
    <a class="nav-link" href="./index.html">Home</a>
    <a class="nav-link" href="./add-card.html">Add Cards</a>
    <a class="nav-link" href="./binders.html">Binders</a>
  </nav>
</header>

  <main class="page glass-panel">
    <h1 class="hero">Your Digital Card Collection</h1>

    

    <section class="carousel" aria-label="Recent cards carousel">
      <button class="arrow" id="carouselPrev" aria-label="Previous cards">
        <span aria-hidden="true">‹</span>
      </button>

      <div class="cards-row" id="cardsRow" role="list" aria-live="polite"></div>

      <button class="arrow" id="carouselNext" aria-label="Next cards">
        <span aria-hidden="true">›</span>
      </button>
    </section>

    <div class="dots" id="dots" aria-label="Carousel pages"></div>

    <div class="pager" aria-label="Page controls">
      <button class="btn" id="pagePrev">‹ Prev</button>
      <div class="page-indicator" id="pageIndicator">Page 1 of 1</div>
      <button class="btn" id="pageNext">Next ›</button>
    </div>
  </main>
  
  <footer class="footer">
    <p>&copy; 2026 CardFlow. All rights reserved.</p>
  </footer>

  <script type="module" src="./js/home.js"></script>
  <script src="./js/navbar.js"></script>  
</body>
</html>
